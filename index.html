<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>온라인마케팅실전 학습 포트폴리오</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    --paper: #f3f1ec;
    --ink: #121212;
    --ink-2: #55534e;
    --ink-3: #8c8a84;
    --rule: #d9d6cf;
    --signal: #ff4f1a;
    --gutter: clamp(16px, 4vw, 56px);
    --sans: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #111110;
      --ink: #eeece6;
      --ink-2: #a9a69e;
      --ink-3: #6e6c66;
      --rule: #2b2a27;
      --signal: #ff6a3d;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.55;
    word-break: keep-all;
    overflow-wrap: anywhere;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  .mono { font-family: var(--mono); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
  .page { max-width: 1320px; margin: 0 auto; padding: 0 var(--gutter); }

  /* 상단 바 */
  .topbar {
    display: flex; justify-content: space-between; gap: 16px;
    padding: 18px 0; border-bottom: 1px solid var(--ink);
    color: var(--ink-2);
  }

  /* 소개 */
  .intro {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 32px 48px;
    align-items: end; padding: clamp(40px, 8vw, 104px) 0 clamp(32px, 5vw, 56px);
  }
  .intro h1 {
    margin: 0; font-weight: 700; letter-spacing: -0.035em;
    font-size: clamp(40px, 8.4vw, 112px); line-height: .98;
  }
  .intro h1 .who { display: block; color: var(--ink-3); font-weight: 400; }
  .intro h1 .who.filled { color: var(--ink); font-weight: 700; }
  /* 입력 요소 공통 */
  .field { display: grid; gap: 4px; min-width: 0; }
  .field > span { color: var(--ink-3); }
  input, select {
    width: 100%; min-width: 0; margin: 0; padding: 6px 0 8px;
    font: inherit; font-size: 16px; color: var(--ink);
    background: transparent; border: 0; border-bottom: 1px solid var(--ink-3); border-radius: 0;
    -webkit-appearance: none; appearance: none;
  }
  select {
    padding-right: 20px; cursor: pointer;
    background: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%) right 6px center / 5px 5px no-repeat,
                linear-gradient(-45deg, transparent 50%, var(--ink-3) 50%) right 1px center / 5px 5px no-repeat;
  }
  select option { color: #121212; }
  input::placeholder { color: var(--ink-3); opacity: .7; }
  input:focus, select:focus { outline: none; border-bottom-color: var(--signal); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 44px; padding: 0 20px; cursor: pointer;
    font: 500 12px/1 var(--mono); letter-spacing: .04em; text-transform: uppercase;
    color: var(--paper); background: var(--ink); border: 1px solid var(--ink); border-radius: 0;
    transition: background-color .2s, border-color .2s;
  }
  .btn:hover { background: var(--signal); border-color: var(--signal); }
  .note { min-height: 1.5em; margin: 0; color: var(--ink-3); }
  .note.ok { color: var(--signal); }

  .profile { display: grid; gap: 16px; width: min(100%, 340px); }
  .profile .btn { justify-self: start; }

  /* 전체 흐름 */
  .flow {
    list-style: none; margin: 0; padding: 0;
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
    border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink);
  }
  .flow li + li { border-left: 1px solid var(--rule); }
  .flow a {
    display: grid; grid-template-rows: auto 1fr auto; gap: 20px;
    height: 100%; padding: 20px 18px 22px;
    transition: background-color .2s;
  }
  .flow a:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
  .flow .idx { display: flex; justify-content: space-between; color: var(--ink-3); }
  .flow .idx .arrow { transition: transform .2s, color .2s; }
  .flow a:hover .arrow { transform: translate(2px, -2px); color: var(--signal); }
  .flow .name { font-size: clamp(18px, 1.7vw, 22px); font-weight: 650; letter-spacing: -0.02em; line-height: 1.25; }
  .ticks { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; min-height: 10px; }
  .ticks i { width: 10px; height: 10px; background: var(--ink); }
  .ticks i.none { background: transparent; box-shadow: inset 0 0 0 1px var(--ink-3); }
  .ticks span { margin-left: 8px; color: var(--ink-3); }

  .stats {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    border-bottom: 1px solid var(--rule);
  }
  .stats div { padding: 18px 18px 20px; }
  .stats div + div { border-left: 1px solid var(--rule); }
  .stats b { display: block; font-size: clamp(28px, 3.6vw, 44px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stats span { color: var(--ink-3); }
  .stats .signal { color: var(--signal); }

  /* 단계 */
  main { padding-bottom: clamp(48px, 8vw, 120px); }
  .stage {
    display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 24px 48px;
    padding: clamp(40px, 6vw, 72px) 0; border-bottom: 1px solid var(--rule);
    scroll-margin-top: 8px;
  }
  .stage-info { position: sticky; top: 24px; align-self: start; }
  .stage-num {
    font-family: var(--mono); font-weight: 500; line-height: .9; letter-spacing: -0.04em;
    font-size: clamp(56px, 8vw, 104px); color: var(--ink-3);
  }
  .stage h2 { margin: 16px 0 12px; font-size: clamp(26px, 3vw, 36px); letter-spacing: -0.03em; line-height: 1.2; }
  .stage-info p { margin: 0 0 20px; color: var(--ink-2); max-width: 44ch; }
  .topics { color: var(--ink-3); line-height: 2; }
  .topics span:not(:last-child)::after { content: "/"; margin: 0 10px; color: var(--rule); }

  .list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
  .row {
    display: grid; grid-template-columns: 36px 88px minmax(0, 1fr) auto; gap: 16px; align-items: baseline;
    padding: 18px 0; border-bottom: 1px solid var(--rule);
  }
  a.title:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
  a.title:hover .go { color: var(--signal); transform: translate(2px, -2px); }
  .row .n, .row .type, .row .date { color: var(--ink-3); }
  .row .title { font-weight: 600; font-size: 17px; letter-spacing: -0.01em; }
  .row .desc { display: block; margin-top: 4px; color: var(--ink-2); font-size: 14px; font-weight: 400; }
  .row .end { display: flex; gap: 14px; align-items: baseline; white-space: nowrap; }
  .row .go { display: inline-block; transition: transform .2s, color .2s; }
  .empty { margin: 0; padding: 28px 0; color: var(--ink-3); border-bottom: 1px solid var(--rule); }
  .del {
    padding: 4px 0; cursor: pointer; font: inherit; color: var(--ink-3);
    background: none; border: 0;
  }
  .del:hover { color: var(--signal); }

  .add {
    display: grid; grid-template-columns: 120px minmax(0, 1fr) 150px; gap: 18px 20px;
    margin-top: 28px; padding: 20px; background: color-mix(in srgb, var(--ink) 4%, transparent);
  }
  .add .wide { grid-column: 1 / -1; }
  .add .actions { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }

  footer { display: flex; justify-content: space-between; gap: 16px; padding: 20px 0 32px; color: var(--ink-3); }

  :focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

  /* 태블릿 */
  @media (max-width: 1024px) {
    .flow { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .flow li:nth-child(4) { border-left: 0; }
    .flow li:nth-child(n+4) { border-top: 1px solid var(--rule); }
    .stage { grid-template-columns: minmax(0, 1fr); }
    .stage-info { position: static; }
  }
  /* 모바일 */
  @media (max-width: 640px) {
    .intro { grid-template-columns: minmax(0, 1fr); align-items: start; }
    .profile { width: 100%; border-top: 1px solid var(--rule); padding-top: 16px; }
    .profile .btn, .add .btn { width: 100%; }
    .add { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); padding: 16px; }
    .add .f-title { grid-column: 1 / -1; order: -1; }
    .flow { grid-template-columns: minmax(0, 1fr); }
    .flow li + li { border-left: 0; border-top: 1px solid var(--rule); }
    .flow a { grid-template-columns: 40px minmax(0, 1fr) auto; grid-template-rows: auto; align-items: center; gap: 12px; padding: 16px 0; }
    .flow .idx .arrow { display: none; }
    .flow .name { font-size: 17px; }
    .ticks { justify-content: flex-end; max-width: 120px; }
    .stats div { padding: 14px 12px 16px 0; }
    .stats div + div { padding-left: 12px; }
    .row { grid-template-columns: 28px minmax(0, 1fr); gap: 4px 12px; }
    .row .type { grid-column: 2; order: -1; }
    .row .n { grid-row: 1 / span 3; }
    .row .end { grid-column: 2; }
    .topbar .hide-sm { display: none; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="topbar mono">
    <span>온라인마케팅실전 2026</span>
    <span class="hide-sm">Learning Portfolio</span>
  </div>

  <header class="intro">
    <h1 id="headline"></h1>
    <form class="profile" id="profile" autocomplete="off">
      <label class="field"><span class="mono">이름</span><input name="name" maxlength="20" placeholder="이름"></label>
      <label class="field"><span class="mono">학과</span><input name="dept" maxlength="40" placeholder="학과"></label>
      <label class="field"><span class="mono">학번</span><input name="id" maxlength="20" inputmode="numeric" placeholder="학번"></label>
      <button class="btn" type="submit">반영하기</button>
      <p class="note mono" id="profile-note" role="status"></p>
    </form>
  </header>

  <nav aria-label="과정 흐름">
    <ol class="flow" id="flow"></ol>
  </nav>
  <div class="stats" id="stats"></div>

  <main id="stages"></main>

  <footer class="mono">
    <span>온라인마케팅실전</span>
    <a href="#top" onclick="window.scrollTo({top:0});return false;">맨 위로 ↑</a>
  </footer>
</div>

<script>
/*
  학생은 페이지에서 직접 입력합니다.
  이름, 학과, 학번과 단계별 자료 링크를 입력하고 반영하기를 누르면 화면에 반영되고
  사용 중인 브라우저에 저장됩니다.
*/
const STAGES = [
  {
    id: "product",
    name: "내 제품 정의",
    desc: "판매하거나 알리고 싶은 제품과 서비스를 정하고, 누구에게 어떤 가치를 주는지 정리합니다.",
    topics: ["제품 선정", "핵심 가치", "타깃 고객", "경쟁 제품"]
  },
  {
    id: "strategy",
    name: "마케팅 전략 기획",
    desc: "정의한 제품을 바탕으로 시장을 나누고, 포지셔닝과 채널, 목표 지표를 설계합니다.",
    topics: ["STP", "포지셔닝", "채널 전략", "목표 KPI"]
  },
  {
    id: "vibecoding",
    name: "바이브코딩",
    desc: "AI 도구와 대화하며 제품 홈페이지와 랜딩페이지를 직접 만들어 봅니다.",
    topics: ["AI 코딩 도구", "홈페이지 제작", "랜딩페이지", "배포"]
  },
  {
    id: "execution",
    name: "마케팅 연동 및 실행",
    desc: "만든 페이지에 분석 도구와 마케팅 채널을 연결하고 실제 캠페인을 운영합니다.",
    topics: ["분석 도구 연동", "SNS 채널", "광고 집행", "콘텐츠 발행"]
  },
  {
    id: "analysis",
    name: "성과분석",
    desc: "수집한 데이터를 목표 지표와 비교해 성과를 평가하고 개선 방향을 도출합니다.",
    topics: ["데이터 수집", "KPI 평가", "인사이트", "개선안"]
  }
];

const TYPES = ["슬라이드", "문서", "실습", "영상", "웹페이지", "기타"];
const STORE_KEY = "om2026-portfolio";

const pad = n => String(n).padStart(2, "0");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = id => document.getElementById(id);
const today = () => {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
};
function safeUrl(v) {
  v = String(v || "").trim();
  if (!v) return "";
  if (!/^https?:\/\//i.test(v)) v = "https://" + v;
  try { const u = new URL(v); return /^https?:$/.test(u.protocol) ? u.href : ""; } catch { return ""; }
}

/* 저장 */
function load() {
  const empty = { profile: { name: "", dept: "", id: "" }, materials: Object.fromEntries(STAGES.map(s => [s.id, []])) };
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY));
    if (saved) {
      Object.assign(empty.profile, saved.profile);
      STAGES.forEach(s => { if (Array.isArray(saved.materials?.[s.id])) empty.materials[s.id] = saved.materials[s.id]; });
    }
  } catch {}
  return empty;
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); return true; } catch { return false; }
}
const state = load();

/* 화면 */
function renderProfile() {
  const { name, dept, id } = state.profile;
  $("headline").innerHTML = `<span class="who${name ? " filled" : ""}">${esc(name || "이름")}</span>학습 포트폴리오`;
  document.title = name ? `${name} | 온라인마케팅실전 학습 포트폴리오` : "온라인마케팅실전 학습 포트폴리오";
  const f = $("profile");
  f.elements.name.value = name; f.elements.dept.value = dept; f.elements.id.value = id;
}

function renderOverview() {
  $("flow").innerHTML = STAGES.map((s, i) => {
    const n = state.materials[s.id].length;
    const ticks = n ? "<i></i>".repeat(n) : `<i class="none"></i>`;
    return `
      <li>
        <a href="#${s.id}">
          <span class="idx mono"><span>${pad(i + 1)}</span><span class="arrow" aria-hidden="true">↘</span></span>
          <span class="name">${esc(s.name)}</span>
          <span class="ticks" aria-label="자료 ${n}개">${ticks}<span class="mono">${n}</span></span>
        </a>
      </li>`;
  }).join("");

  const counts = STAGES.map(s => state.materials[s.id].length);
  const total = counts.reduce((a, b) => a + b, 0);
  const done = counts.filter(Boolean).length;
  const next = counts.findIndex(n => !n);
  $("stats").innerHTML = `
    <div><b>${done}<span class="mono"> / ${STAGES.length}</span></b><span class="mono">진행 단계</span></div>
    <div><b>${total}</b><span class="mono">누적 자료</span></div>
    <div><b class="${next >= 0 ? "signal" : ""}">${next >= 0 ? pad(next + 1) : "완료"}</b><span class="mono">${next >= 0 ? "다음 단계" : "전체 과정"}</span></div>`;
}

function listHtml(s) {
  const items = state.materials[s.id];
  if (!items.length) return `<p class="empty mono">등록된 자료 없음</p>`;
  return `<ol class="list">${items.map((m, j) => {
    const title = m.url
      ? `<a class="title" href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.title)} <span class="go" aria-hidden="true">↗</span></a>`
      : `<span class="title">${esc(m.title)}</span>`;
    return `<li class="row">
      <span class="n mono">${pad(j + 1)}</span>
      <span class="type mono">${esc(m.type)}</span>
      <span class="body">${title}${m.desc ? `<span class="desc">${esc(m.desc)}</span>` : ""}</span>
      <span class="end">
        ${m.date ? `<span class="date mono">${esc(m.date)}</span>` : ""}
        <button class="del mono" type="button" data-stage="${s.id}" data-index="${j}">삭제</button>
      </span>
    </li>`;
  }).join("")}</ol>`;
}

function renderStages() {
  $("stages").innerHTML = STAGES.map((s, i) => `
    <section class="stage" id="${s.id}">
      <div class="stage-info">
        <div class="stage-num">${pad(i + 1)}</div>
        <h2>${esc(s.name)}</h2>
        <p>${esc(s.desc)}</p>
        <div class="topics mono">${s.topics.map(t => `<span>${esc(t)}</span>`).join("")}</div>
      </div>
      <div>
        <div class="list-wrap" id="list-${s.id}">${listHtml(s)}</div>
        <form class="add" data-stage="${s.id}" autocomplete="off">
          <label class="field"><span class="mono">종류</span>
            <select name="type">${TYPES.map(t => `<option>${t}</option>`).join("")}</select>
          </label>
          <label class="field f-title"><span class="mono">제목</span><input name="title" maxlength="80" placeholder="자료 제목" required></label>
          <label class="field"><span class="mono">날짜</span><input name="date" type="date" value="${today()}"></label>
          <label class="field wide"><span class="mono">링크</span><input name="url" type="text" inputmode="url" placeholder="https://" maxlength="500"></label>
          <label class="field wide"><span class="mono">설명</span><input name="desc" maxlength="120" placeholder="한 줄 설명 (선택)"></label>
          <div class="actions">
            <button class="btn" type="submit">반영하기</button>
            <p class="note mono" role="status"></p>
          </div>
        </form>
      </div>
    </section>`).join("");
}

function refreshStage(id) {
  $("list-" + id).innerHTML = listHtml(STAGES.find(s => s.id === id));
  renderOverview();
}

function flash(el, ok, msg) {
  el.textContent = msg;
  el.className = "note mono" + (ok ? " ok" : "");
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.textContent = ""; }, 3000);
}
const savedMsg = () => save() ? "반영되었습니다" : "반영되었지만 이 브라우저에는 저장되지 않습니다";

/* 이벤트 */
$("profile").addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  state.profile = { name: f.elements.name.value.trim(), dept: f.elements.dept.value.trim(), id: f.elements.id.value.trim() };
  renderProfile();
  flash($("profile-note"), true, savedMsg());
});

$("stages").addEventListener("submit", e => {
  const f = e.target.closest("form.add");
  if (!f) return;
  e.preventDefault();
  const note = f.querySelector(".note");
  const title = f.elements.title.value.trim();
  if (!title) { flash(note, false, "제목을 입력하세요"); f.elements.title.focus(); return; }
  const rawUrl = f.elements.url.value.trim();
  const url = safeUrl(rawUrl);
  if (rawUrl && !url) { flash(note, false, "링크 주소를 확인하세요"); f.elements.url.focus(); return; }
  state.materials[f.dataset.stage].push({
    type: f.elements.type.value, title, url, date: f.elements.date.value, desc: f.elements.desc.value.trim()
  });
  refreshStage(f.dataset.stage);
  f.elements.title.value = ""; f.elements.url.value = ""; f.elements.desc.value = "";
  flash(note, true, savedMsg());
});

$("stages").addEventListener("click", e => {
  const b = e.target.closest(".del");
  if (!b) return;
  const list = state.materials[b.dataset.stage];
  const item = list[+b.dataset.index];
  if (!item || !confirm(`"${item.title}" 자료를 삭제할까요?`)) return;
  list.splice(+b.dataset.index, 1);
  save();
  refreshStage(b.dataset.stage);
});

renderProfile();
renderOverview();
renderStages();
</script>
</body>
</html>
