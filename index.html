<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>온라인마케팅실전</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --text: #1c1c1e;
    --muted: #6b6b70;
    --line: #e4e4e0;
    --accent: #2f5bea;
    --accent-soft: #e8eeff;
    --s1: #2f5bea;
    --s2: #7a4fd6;
    --s3: #0e9f8a;
    --s4: #e0781b;
    --s5: #d6336c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416;
      --surface: #1d1d20;
      --text: #ececee;
      --muted: #9a9aa2;
      --line: #2e2e33;
      --accent: #7c9bff;
      --accent-soft: #232a45;
      --s1: #7c9bff;
      --s2: #a98bf0;
      --s3: #3cc7b1;
      --s4: #f2a05a;
      --s5: #f0719b;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.6;
    word-break: keep-all;
  }
  a { color: inherit; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }

  header.hero { padding: 56px 0 32px; }
  .eyebrow { font-size: 14px; color: var(--muted); letter-spacing: .02em; margin: 0 0 8px; }
  h1 { font-size: clamp(28px, 5vw, 40px); line-height: 1.25; margin: 0 0 12px; font-weight: 800; }
  .lead { color: var(--muted); margin: 0; max-width: 640px; }

  /* 전체 흐름 */
  .flow {
    list-style: none; margin: 32px 0 0; padding: 0;
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px;
    counter-reset: step;
  }
  .flow li { position: relative; }
  .flow a {
    display: flex; flex-direction: column; gap: 6px; height: 100%;
    padding: 18px 16px; border-radius: 14px; text-decoration: none;
    background: var(--surface); border: 1px solid var(--line);
    transition: transform .15s, border-color .15s;
  }
  .flow a:hover { transform: translateY(-2px); border-color: var(--c); }
  .flow .num { font-size: 13px; font-weight: 700; color: var(--c); }
  .flow .name { font-size: 17px; font-weight: 700; }
  .flow .count { font-size: 13px; color: var(--muted); margin-top: auto; }
  .flow .bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .flow .bar span { display: block; height: 100%; background: var(--c); }
  .flow li:not(:last-child)::after {
    content: ""; position: absolute; top: 50%; right: -10px; width: 8px; height: 8px;
    border-top: 2px solid var(--muted); border-right: 2px solid var(--muted);
    transform: translateY(-50%) rotate(45deg); opacity: .6;
  }

  .summary {
    display: flex; flex-wrap: wrap; gap: 24px; margin: 24px 0 0; padding: 16px 20px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    font-size: 14px; color: var(--muted);
  }
  .summary b { display: block; font-size: 22px; color: var(--text); }

  /* 단계별 섹션 */
  main { padding: 24px 0 72px; }
  section.stage { padding: 40px 0 8px; scroll-margin-top: 16px; }
  .stage-head { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 20px; }
  .badge {
    flex: none; width: 44px; height: 44px; border-radius: 12px;
    display: grid; place-items: center; font-weight: 800; color: #fff; background: var(--c);
  }
  .stage-head h2 { margin: 0; font-size: 24px; }
  .stage-head p { margin: 4px 0 0; color: var(--muted); }
  .topics { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; padding: 0; list-style: none; }
  .topics li { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .card {
    display: flex; flex-direction: column; gap: 6px; padding: 18px;
    background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c);
    border-radius: 12px; text-decoration: none;
  }
  a.card:hover { border-color: var(--c); }
  .card .meta { display: flex; gap: 8px; font-size: 12px; color: var(--muted); }
  .card .type { font-weight: 700; color: var(--c); }
  .card h3 { margin: 0; font-size: 16px; }
  .card p { margin: 0; font-size: 14px; color: var(--muted); }
  .empty {
    padding: 24px; text-align: center; color: var(--muted); font-size: 14px;
    border: 1px dashed var(--line); border-radius: 12px;
  }

  footer { padding: 24px 0 40px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); }

  @media (max-width: 760px) {
    .flow { grid-template-columns: 1fr; gap: 8px; }
    .flow a { flex-direction: row; align-items: center; flex-wrap: wrap; gap: 4px 12px; }
    .flow .count { margin-top: 0; margin-left: auto; }
    .flow .bar { flex-basis: 100%; }
    .flow li:not(:last-child)::after {
      top: auto; bottom: -8px; right: 50%; transform: translateX(50%) rotate(135deg);
    }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <p class="eyebrow">2026 온라인마케팅실전</p>
    <h1>내 제품을 직접 기획하고, 만들고, 알리고, 측정합니다</h1>
    <p class="lead">강의 계획의 다섯 단계를 순서대로 따라가며 학습자료를 확인하세요. 각 단계를 누르면 해당 자료로 이동합니다.</p>

    <ol class="flow" id="flow"></ol>
    <div class="summary" id="summary"></div>
  </div>
</header>

<main>
  <div class="wrap" id="stages"></div>
</main>

<footer>
  <div class="wrap">온라인마케팅실전 2026</div>
</footer>

<script>
/*
  학습자료 추가 방법
  1. 아래 STAGES에서 해당 단계의 materials 배열에 항목을 추가합니다.
  2. 파일은 materials/ 폴더의 단계별 하위 폴더에 올리고 url에 경로를 적습니다.
     외부 링크(구글 슬라이드, 유튜브 등)는 전체 주소를 적으면 됩니다.

  { title: "자료 제목", type: "슬라이드", date: "2026-09-01", url: "materials/01-product/파일.pdf", desc: "한 줄 설명" }
*/
const STAGES = [
  {
    id: "product",
    name: "내 제품 정의",
    desc: "판매하거나 알리고 싶은 제품과 서비스를 정하고, 누구에게 어떤 가치를 주는지 정리합니다.",
    topics: ["제품 선정", "핵심 가치", "타깃 고객", "경쟁 제품"],
    materials: []
  },
  {
    id: "strategy",
    name: "마케팅 전략 기획",
    desc: "정의한 제품을 바탕으로 시장을 나누고, 포지셔닝과 채널, 목표 지표를 설계합니다.",
    topics: ["STP", "포지셔닝", "채널 전략", "목표 KPI"],
    materials: []
  },
  {
    id: "vibecoding",
    name: "바이브코딩",
    desc: "AI 도구와 대화하며 제품 홈페이지와 랜딩페이지를 직접 만들어 봅니다.",
    topics: ["AI 코딩 도구", "홈페이지 제작", "랜딩페이지", "배포"],
    materials: []
  },
  {
    id: "execution",
    name: "마케팅 연동 및 실행",
    desc: "만든 페이지에 분석 도구와 마케팅 채널을 연결하고 실제 캠페인을 운영합니다.",
    topics: ["분석 도구 연동", "SNS 채널", "광고 집행", "콘텐츠 발행"],
    materials: []
  },
  {
    id: "analysis",
    name: "성과분석",
    desc: "수집한 데이터를 목표 지표와 비교해 성과를 평가하고 개선 방향을 도출합니다.",
    topics: ["데이터 수집", "KPI 평가", "인사이트", "개선안"],
    materials: []
  }
];

const COLORS = ["--s1", "--s2", "--s3", "--s4", "--s5"];

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function render() {
  const total = STAGES.reduce((n, s) => n + s.materials.length, 0);
  const max = Math.max(1, ...STAGES.map(s => s.materials.length));

  document.getElementById("flow").innerHTML = STAGES.map((s, i) => `
    <li style="--c: var(${COLORS[i]})">
      <a href="#${s.id}">
        <span class="num">STEP ${i + 1}</span>
        <span class="name">${esc(s.name)}</span>
        <span class="count">자료 ${s.materials.length}개</span>
        <span class="bar"><span style="width:${(s.materials.length / max) * 100}%"></span></span>
      </a>
    </li>`).join("");

  const done = STAGES.filter(s => s.materials.length > 0).length;
  document.getElementById("summary").innerHTML = `
    <div><b>${STAGES.length}단계</b>전체 과정</div>
    <div><b>${done} / ${STAGES.length}</b>자료가 올라온 단계</div>
    <div><b>${total}개</b>누적 학습자료</div>`;

  document.getElementById("stages").innerHTML = STAGES.map((s, i) => {
    const cards = s.materials.length
      ? `<div class="cards">${s.materials.map(m => {
          const tag = m.url ? "a" : "div";
          const href = m.url ? ` href="${esc(m.url)}" target="_blank" rel="noopener"` : "";
          return `<${tag} class="card"${href}>
            <div class="meta"><span class="type">${esc(m.type || "자료")}</span>${m.date ? `<span>${esc(m.date)}</span>` : ""}</div>
            <h3>${esc(m.title)}</h3>
            ${m.desc ? `<p>${esc(m.desc)}</p>` : ""}
          </${tag}>`;
        }).join("")}</div>`
      : `<div class="empty">아직 등록된 자료가 없습니다.</div>`;
    return `
      <section class="stage" id="${s.id}" style="--c: var(${COLORS[i]})">
        <div class="stage-head">
          <div class="badge">${i + 1}</div>
          <div>
            <h2>${esc(s.name)}</h2>
            <p>${esc(s.desc)}</p>
            <ul class="topics">${s.topics.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
          </div>
        </div>
        ${cards}
      </section>`;
  }).join("");
}

render();
</script>
</body>
</html>
